# Cloud Run NON-SECRET config for the pronto-pc backend.
#   gcloud run deploy ... --env-vars-file deploy/cloudrun.env.yaml
#
# SECRETS (Stripe / Resend / Azure / Gemini / loyalty key) are NOT here — set them
# via Secret Manager + --set-secrets (see deploy/DEPLOY_BACKEND.md). Never put a key
# in this file; it is committed to git.
#
# PORT is injected by Cloud Run automatically — never set it here.

# ── Email (make-good + coupons + guardian) ───────────────────────────────────
# NOTE: support@prontopc.online must be a VERIFIED sender domain in Resend, or all
# emails silently no-op.
FROM_EMAIL: "support@prontopc.online"
SUPPORT_EMAIL: "support@prontopc.online"

# ── URLs ─────────────────────────────────────────────────────────────────────
SITE_URL: "https://prontopc.online"
CLOUD_RUN_URL: "https://pronto-pc-108655745293.us-central1.run.app"

# ── Next-repair loyalty coupon (50% off) ─────────────────────────────────────
COUPON_ID: "NEXTREPAIR50"
COUPON_VALID_DAYS: "180"

# ── AI-unavailable make-good coupon (100% off) ───────────────────────────────
# Auto-created in Stripe on first use; these just name it and set validity.
MAKEGOOD_COUPON_ID: "AIMAKEGOOD100"
MAKEGOOD_VALID_DAYS: "180"

# ── Cloud LLM fallback author (OPTIONAL — on-device Gemma is primary) ─────────
# Endpoint is non-secret; the KEY (AZURE_OPENAI_KEY) goes in Secret Manager.
# Leave the endpoint blank to disable the Azure fallback entirely.
AZURE_OPENAI_ENDPOINT: ""
AZURE_OPENAI_DEPLOYMENT: "gpt-41-mini"
AZURE_OPENAI_API_VERSION: "2024-10-21"

# ── Guardian subscription Stripe price IDs (OPTIONAL) ────────────────────────
GUARDIAN_PRICE_MONTHLY: ""
GUARDIAN_PRICE_WEEKLY: ""
